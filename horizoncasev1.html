<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Horizon Case</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: #070b14;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      padding: 12px;
      color: #eef3ff;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .app {
      max-width: 480px;
      width: 100%;
      margin: 0 auto;
      background: rgba(13, 20, 36, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 48px;
      padding: 22px 18px 18px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(90, 170, 255, 0.06);
      border: 1px solid rgba(80, 160, 255, 0.03);
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(80, 160, 255, 0.04);
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      background: linear-gradient(135deg, #a0d0ff, #4a8ecf, #a0d0ff, #e0f0ff);
      background-size: 300% 300%;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: iceGlow 4s ease-in-out infinite;
      text-shadow: 0 0 40px rgba(80, 180, 255, 0.08);
    }

    @keyframes iceGlow {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .header .stars {
      background: rgba(20, 45, 80, 0.5);
      backdrop-filter: blur(8px);
      padding: 6px 18px;
      border-radius: 60px;
      font-weight: 700;
      font-size: 16px;
      color: #f5c542;
      border: 1px solid rgba(245, 197, 66, 0.06);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: 0 0 40px rgba(245, 197, 66, 0.02);
    }

    .balance-row {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(12, 20, 40, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 60px;
      padding: 8px 18px;
      margin-bottom: 20px;
      border: 1px solid rgba(80, 160, 255, 0.04);
      flex-wrap: wrap;
    }
    .balance-row .stars-big {
      font-size: 26px;
      font-weight: 700;
      color: #f5c542;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .balance-row .stars-big span {
      font-size: 18px;
      font-weight: 400;
      color: #7a8fc9;
      margin-left: 2px;
    }
    .balance-row .demo-btn {
      margin-left: auto;
      background: rgba(40, 80, 140, 0.2);
      border: 1px solid rgba(80, 160, 255, 0.06);
      padding: 6px 22px;
      border-radius: 60px;
      color: #b0d0ff;
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: 0.15s;
      font-family: inherit;
      backdrop-filter: blur(4px);
    }
    .balance-row .demo-btn:active {
      transform: scale(0.94);
      background: rgba(60, 120, 200, 0.15);
    }

    .cases-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 20px;
      max-width: 280px;
      margin-left: auto;
      margin-right: auto;
    }

    .case-card {
      background: rgba(17, 27, 46, 0.6);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 24px 10px 20px;
      border: 1px solid rgba(80, 160, 255, 0.03);
      text-align: center;
      cursor: pointer;
      transition: all 0.2s ease;
      position: relative;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }
    .case-card:active {
      transform: scale(0.95);
      border-color: rgba(80, 160, 255, 0.08);
    }
    .case-card .case-icon-img {
      height: 72px;
      width: 72px;
      display: block;
      margin: 0 auto 8px;
      filter: drop-shadow(0 0 30px rgba(100, 160, 255, 0.04));
    }
    .case-card .case-name {
      font-size: 18px;
      font-weight: 700;
      color: #d6e8ff;
      margin-bottom: 4px;
    }
    .case-card .case-price {
      font-size: 16px;
      font-weight: 700;
      color: #f5c542;
      margin-top: 8px;
      background: rgba(20, 50, 100, 0.15);
      padding: 4px 18px;
      border-radius: 60px;
      display: inline-block;
      border: 1px solid rgba(245, 197, 66, 0.06);
      backdrop-filter: blur(4px);
    }
    .case-card .case-price img {
      height: 16px;
      width: 16px;
      vertical-align: middle;
      display: inline-block;
    }
    .case-card .promo-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      background: linear-gradient(135deg, #f5c542, #e6a800);
      color: #0a0e1a;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 12px;
      border-radius: 40px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 0 40px rgba(245, 197, 66, 0.06);
    }

    .star-icon {
      height: 18px;
      width: 18px;
      vertical-align: middle;
      display: inline-block;
    }
    .star-icon-sm {
      height: 16px;
      width: 16px;
      vertical-align: middle;
      display: inline-block;
    }

    .case-page {
      display: none;
      animation: fadeIn 0.3s ease;
    }
    .case-page.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .case-page .back-btn {
      background: transparent;
      border: none;
      color: #6a80b0;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      padding: 6px 0;
      font-family: inherit;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: 0.15s;
      margin-bottom: 6px;
    }
    .case-page .back-btn:active {
      transform: scale(0.94);
      color: #a0c0ff;
    }

    .case-page .case-title {
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 6px;
      color: #d6e8ff;
    }
    .case-page .case-title .icon-img {
      height: 72px;
      width: 72px;
      display: block;
      margin: 0 auto 2px;
    }

    .promo-area {
      background: rgba(12, 20, 40, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 60px;
      padding: 8px 14px;
      border: 1px solid rgba(80, 160, 255, 0.04);
      margin-bottom: 14px;
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }
    .promo-area input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(80, 160, 255, 0.04);
      border-radius: 40px;
      padding: 10px 18px;
      color: #e8edff;
      font-size: 14px;
      outline: none;
      font-family: inherit;
      min-width: 120px;
    }
    .promo-area input::placeholder {
      color: #4a5f80;
    }
    .promo-area input:focus {
      border-color: rgba(80, 160, 255, 0.08);
    }
    .promo-area .promo-btn {
      background: linear-gradient(135deg, #f5c542, #e6a800);
      border: none;
      padding: 10px 26px;
      border-radius: 60px;
      color: #0a0e1a;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: 0.15s;
      font-family: inherit;
      box-shadow: 0 0 40px rgba(245, 197, 66, 0.03);
    }
    .promo-area .promo-btn:active {
      transform: scale(0.94);
    }
    .promo-area .promo-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .promo-status {
      font-size: 13px;
      color: #6a80b0;
      width: 100%;
      text-align: center;
      padding-top: 4px;
    }
    .promo-status.success {
      color: #5abf6a;
    }
    .promo-status.error {
      color: #ff6b6b;
    }

    .slot-machine {
      background: rgba(8, 14, 30, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      padding: 24px 16px;
      border: 1px solid rgba(80, 160, 255, 0.04);
      margin: 10px 0 14px;
      text-align: center;
      min-height: 100px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      transition: border-color 0.3s;
      box-shadow: inset 0 0 80px rgba(0, 0, 0, 0.3);
    }
    .slot-machine .spin-text {
      font-size: 34px;
      font-weight: 900;
      color: #f5c542;
      text-shadow: 0 0 60px rgba(245, 197, 66, 0.03);
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 4px;
      justify-content: center;
    }
    .slot-machine .spin-sub {
      font-size: 14px;
      color: #6a80b0;
      margin-top: 2px;
    }
    .slot-machine .spin-rarity {
      font-size: 14px;
      font-weight: 600;
      padding: 4px 24px;
      border-radius: 60px;
      background: rgba(255, 255, 255, 0.02);
      margin-top: 4px;
    }

    .slot-machine.spinning .spin-text {
      animation: blink 0.15s infinite alternate;
    }
    @keyframes blink {
      0% { opacity: 0.2; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    .rarity-common { color: #6a8aaf; }
    .rarity-uncommon { color: #5abf6a; }
    .rarity-rare { color: #3a8aff; }
    .rarity-epic { color: #b06af0; }
    .rarity-legendary { color: #f0a030; }
    .rarity-mythic { color: #ff4060; }

    .open-btn {
      background: linear-gradient(135deg, #2a5a9a, #1a3a6a);
      border: none;
      padding: 16px;
      border-radius: 60px;
      color: white;
      font-weight: 700;
      font-size: 18px;
      cursor: pointer;
      transition: 0.06s;
      box-shadow: 0 8px 0 #0b1a30, 0 8px 50px rgba(40, 100, 200, 0.03);
      width: 100%;
      font-family: inherit;
      margin-bottom: 14px;
      border: 1px solid rgba(80, 160, 255, 0.04);
    }
    .open-btn:active {
      transform: scale(0.94);
      box-shadow: 0 2px 0 #0b1a30;
    }
    .open-btn:disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .main-prize {
      background: rgba(12, 20, 40, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 14px 20px;
      border: 1px solid rgba(80, 160, 255, 0.04);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .main-prize .label {
      color: #6a80b0;
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .main-prize .prize-lottie {
      width: 80px;
      height: 80px;
      pointer-events: none;
      margin: 0 auto;
    }
    .main-prize .prize-lottie svg {
      width: 100%;
      height: 100%;
    }
    .main-prize .prize-stars {
      color: #f5c542;
      font-weight: 700;
      font-size: 18px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .prizes-list {
      background: rgba(12, 20, 40, 0.4);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 10px 20px;
      border: 1px solid rgba(80, 160, 255, 0.04);
      margin-bottom: 8px;
    }
    .prizes-list .prize-row {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      border-bottom: 1px solid rgba(80, 160, 255, 0.02);
      font-size: 14px;
    }
    .prizes-list .prize-row:last-child {
      border-bottom: none;
    }
    .prizes-list .prize-row .p-name {
      color: #8ba0dd;
    }
    .prizes-list .prize-row .p-stars {
      color: #f5c542;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .bottom-nav {
      display: flex;
      justify-content: space-around;
      background: rgba(8, 14, 30, 0.5);
      backdrop-filter: blur(12px);
      border-radius: 60px;
      padding: 6px 4px;
      border: 1px solid rgba(80, 160, 255, 0.04);
      margin-top: 12px;
    }
    .bottom-nav button {
      background: transparent;
      border: none;
      color: #4a5f80;
      font-weight: 600;
      font-size: 12px;
      padding: 8px 0;
      flex: 1;
      cursor: pointer;
      transition: 0.15s;
      border-radius: 30px;
      font-family: inherit;
    }
    .bottom-nav button.active {
      color: #d6e8ff;
      background: rgba(40, 80, 160, 0.12);
    }
    .bottom-nav button:active {
      transform: scale(0.94);
    }

    .tab { display: none; }
    .tab.active { display: block; }
    .placeholder {
      text-align: center;
      padding: 40px 16px;
      color: #3d4e7a;
    }
    .placeholder .big-icon {
      font-size: 48px;
      display: block;
      margin-bottom: 8px;
      opacity: 0.3;
    }
    .placeholder div {
      font-size: 16px;
      color: #6a80b0;
    }

    @media (max-width: 420px) {
      .cases-grid { gap: 8px; }
      .case-card .case-icon-img { height: 60px; width: 60px; }
      .case-card .case-name { font-size: 15px; }
      .case-page .case-title { font-size: 20px; }
      .case-page .case-title .icon-img { height: 60px; width: 60px; }
      .main-prize .prize-lottie { width: 60px; height: 60px; }
      .slot-machine .spin-text { font-size: 26px; }
      .header h1 { font-size: 18px; }
      .star-icon { height: 14px; width: 14px; }
      .star-icon-sm { height: 12px; width: 12px; }
      .bottom-nav button { font-size: 10px; padding: 6px 0; }
    }
  </style>
</head>
<body>
<div class="app">

  <div class="header">
    <h1>Horizon Case</h1>
    <div class="stars">
      <img src="https://i.postimg.cc/V6tZb84Y/optimize-fotor-bg-remover-20260905105812.png" alt="⭐" class="star-icon">
      <span id="headerStars">0</span>
    </div>
  </div>

  <div class="balance-row">
    <div class="stars-big">
      <img src="https://i.postimg.cc/V6tZb84Y/optimize-fotor-bg-remover-20260905105812.png" alt="⭐" class="star-icon">
      <span id="balanceStars">0</span>
      <span>звёзд</span>
    </div>
    <button class="demo-btn" id="demoBtn">🎲 Демо</button>
  </div>

  <div class="tab active" id="tab-main">
    <div class="cases-grid" id="casesGrid"></div>
  </div>

  <div class="case-page" id="casePage">
    <button class="back-btn" id="backBtn">← Назад</button>
    <div class="case-title">
      <img src="https://i.postimg.cc/vT3r42RD/1788588183135-fotor-bg-remover-2026090511346.png" alt="Promo Case" class="icon-img" id="casePageIcon">
      <span id="casePageName">Promo Case</span>
    </div>

    <div class="promo-area" id="promoArea">
      <input type="text" id="promoInput" placeholder="Введите промокод" maxlength="20">
      <button class="promo-btn" id="promoBtn">Активировать</button>
      <div class="promo-status" id="promoStatus"></div>
    </div>

    <div class="slot-machine" id="slotMachine">
      <div class="spin-text" id="spinText">
        <img src="https://i.postimg.cc/V6tZb84Y/optimize-fotor-bg-remover-20260905105812.png" alt="⭐" class="star-icon"> +0
      </div>
      <div class="spin-sub" id="spinSub">Нажмите «Открыть»</div>
      <div class="spin-rarity" id="spinRarity"></div>
    </div>

    <button class="open-btn" id="openBtn" disabled>🎁 Открыть</button>

    <div class="main-prize">
      <div>
        <div class="label">🏆 Главный приз</div>
        <div class="prize-lottie" id="mainPrizeLottie"></div>
      </div>
      <div class="prize-stars">
        <img src="https://i.postimg.cc/V6tZb84Y/optimize-fotor-bg-remover-20260905105812.png" alt="⭐" class="star-icon-sm">
        <span id="mainPrizeStarsRight">0</span>
      </div>
    </div>

    <div class="prizes-list" id="prizesList"></div>
  </div>

  <div class="tab" id="tab-tasks">
    <div class="placeholder"><span class="big-icon">📋</span><div>Задания временно недоступны</div></div>
  </div>
  <div class="tab" id="tab-crash">
    <div class="placeholder"><span class="big-icon">💥</span><div>Краш временно недоступен</div></div>
  </div>
  <div class="tab" id="tab-pvp">
    <div class="placeholder"><span class="big-icon">⚔️</span><div>PVP временно недоступен</div></div>
  </div>
  <div class="tab" id="tab-modes">
    <div class="placeholder"><span class="big-icon">🎮</span><div>Режимы временно недоступны</div></div>
  </div>
  <div class="tab" id="tab-profile">
    <div class="placeholder"><span class="big-icon">👤</span><div>Профиль временно недоступен</div></div>
  </div>

  <div class="bottom-nav" id="bottomNav">
    <button class="active" data-tab="main">Главная</button>
    <button data-tab="tasks">Задания</button>
    <button data-tab="crash">Краш</button>
    <button data-tab="pvp">PVP</button>
    <button data-tab="modes">Режимы</button>
    <button data-tab="profile">Профиль</button>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js"></script>

<script>
  // ============================================================
  //  ЗАГРУЗКА АНИМАЦИИ ИЗ ВНЕШНЕГО ФАЙЛА 001.min.json
  // ============================================================

  const LOTTIE_URL = '001.min.json';

  // ============================================================
  //  ОСТАЛЬНЫЕ ДАННЫЕ
  // ============================================================

  const PRIZES_FROM_JSON = {
    "prizes": [
      { "name": "Подарок #1", "stars": 10893 },
      { "name": "Подарок #2", "stars": 8560 },
      { "name": "Подарок #3", "stars": 6449 },
      { "name": "Подарок #4", "stars": 4952 }
    ]
  };

  const RARITIES = [
    { id: 'common', label: 'Обычный', color: '#6a8aaf', weight: 45 },
    { id: 'uncommon', label: 'Необычный', color: '#5abf6a', weight: 30 },
    { id: 'rare', label: 'Редкий', color: '#3a8aff', weight: 15 },
    { id: 'epic', label: 'Эпический', color: '#b06af0', weight: 7 },
    { id: 'legendary', label: 'Легендарный', color: '#f0a030', weight: 2.5 },
    { id: 'mythic', label: 'Мифический', color: '#ff4060', weight: 0.5 }
  ];

  const CASES = [
    { id: 'promo', name: 'Promo Case', icon: 'https://i.postimg.cc/vT3r42RD/1788588183135-fotor-bg-remover-2026090511346.png', price: 0, promo: true }
  ];

  const PRIZES = PRIZES_FROM_JSON.prizes;

  // ============================================================
  //  STATE
  // ============================================================

  let state = {
    balance: 0,
    opened: 0,
    history: [],
    bestWin: 0,
    usedPromoCodes: []
  };

  let currentCase = null;
  let isSpinning = false;
  let pendingWin = null;
  let currentPromoActivated = false;
  let lottiePrizeInstance = null;

  // ============================================================
  //  STORAGE
  // ============================================================

  function loadState() {
    try {
      const raw = localStorage.getItem('horizon_state');
      if (raw) {
        const parsed = JSON.parse(raw);
        state.balance = parsed.balance ?? 0;
        state.opened = parsed.opened ?? 0;
        state.history = parsed.history ?? [];
        state.bestWin = parsed.bestWin ?? 0;
        state.usedPromoCodes = parsed.usedPromoCodes ?? [];
      }
    } catch (e) {}
    updateUI();
  }

  function saveState() {
    try {
      localStorage.setItem('horizon_state', JSON.stringify({
        balance: state.balance,
        opened: state.opened,
        history: state.history,
        bestWin: state.bestWin,
        usedPromoCodes: state.usedPromoCodes
      }));
    } catch (e) {}
  }

  // ============================================================
  //  LOTTIE
  // ============================================================

  function initLottie(containerId, loop = true, autoplay = true) {
    const container = document.getElementById(containerId);
    if (!container) return null;
    container.innerHTML = '';
    try {
      const anim = lottie.loadAnimation({
        container: container,
        renderer: 'svg',
        loop: loop,
        autoplay: autoplay,
        path: LOTTIE_URL
      });
      return anim;
    } catch (e) {
      console.warn('Lottie error:', e);
      return null;
    }
  }

  function destroyLottie(instance) {
    if (instance) {
      instance.destroy();
    }
  }

  // ============================================================
  //  HELPERS
  // ============================================================

  function randomWin() {
    const amount = Math.floor(Math.random() * 16) + 5;
    let totalWeight = 0;
    const weighted = RARITIES.map(r => {
      totalWeight += r.weight;
      return r;
    });
    let roll = Math.random() * totalWeight;
    let chosen = weighted[0];
    for (const r of weighted) {
      roll -= r.weight;
      if (roll <= 0) { chosen = r; break; }
    }
    return { amount, rarity: chosen };
  }

  function setSlotResult(main, sub, rarity, color) {
    document.getElementById('spinText').innerHTML = main;
    document.getElementById('spinSub').textContent = sub || '';
    document.getElementById('spinRarity').textContent = rarity || '';
    document.getElementById('spinRarity').className = 'spin-rarity';
    if (color) {
      document.getElementById('slotMachine').style.borderColor = color;
      setTimeout(() => { document.getElementById('slotMachine').style.borderColor = 'rgba(60,140,255,0.04)'; }, 800);
    }
  }

  // ============================================================
  //  SPIN
  // ============================================================

  function startSpin(demoMode = false) {
    if (isSpinning) return;
    if (!currentCase) return;

    if (demoMode) {
      demoSpin();
      return;
    }

    if (currentCase.promo) {
      if (!currentPromoActivated) {
        setSlotResult('🔑', 'Активируйте промокод!', '', '#f5c542');
        return;
      }
    }

    const win = randomWin();
    pendingWin = win;

    isSpinning = true;
    const slot = document.getElementById('slotMachine');
    slot.classList.add('spinning');

    document.getElementById('openBtn').disabled = true;
    document.getElementById('promoBtn').disabled = true;

    let count = 0;
    const interval = setInterval(() => {
      const fake = Math.floor(Math.random() * 20) + 1;
      document.getElementById('spinText').innerHTML = `
        <img src="https://i.postimg.cc/V6tZb84Y/optimize-fotor-bg-remover-20260905105812.png" alt="⭐" class="star-icon"> +${fake}
      `;
      document.getElementById('spinSub').textContent = '···';
      document.getElementById('spinRarity').textContent = '';
      count++;
      if (count > 12) {
        clearInterval(interval);
        slot.classList.remove('spinning');
        isSpinning = false;

        state.balance += pendingWin.amount;
        state.opened += 1;
        if (pendingWin.amount > state.bestWin) state.bestWin = pendingWin.amount;

        state.history.unshift({
          amount: pendingWin.amount,
          rarity: pendingWin.rarity.id,
          label: pendingWin.rarity.label,
          case: currentCase.name
        });
        if (state.history.length > 50) state.history.pop();

        saveState();
        updateUI();

        const rarityClass = 'rarity-' + pendingWin.rarity.id;
        document.getElementById('spinText').innerHTML = `
          <img src="https://i.postimg.cc/V6tZb84Y/optimize-fotor-bg-remover-20260905105812.png" alt="⭐" class="star-icon"> +${pendingWin.amount}
        `;
        document.getElementById('spinSub').textContent = 'Выпало!';
        document.getElementById('spinRarity').textContent = pendingWin.rarity.label;
        document.getElementById('spinRarity').className = 'spin-rarity ' + rarityClass;
        slot.style.borderColor = pendingWin.rarity.color;
        setTimeout(() => { slot.style.borderColor = 'rgba(60,140,255,0.04)'; }, 800);

        document.getElementById('openBtn').disabled = false;
        document.getElementById('promoBtn').disabled = false;

        if (currentCase.promo) {
          currentPromoActivated = false;
          document.getElementById('openBtn').disabled = true;
          document.getElementById('promoStatus').textContent = '✅ Кейс открыт. Введите новый промокод';
          document.getElementById('promoStatus').className = 'promo-status success';
          document.getElementById('promoInput').value = '';
          document.getElementById('promoInput').disabled = false;
          document.getElementById('promoBtn').disabled = false;
        }

        pendingWin = null;
      }
    }, 70);
  }

  function demoSpin() {
    if (isSpinning) return;
    isSpinning = true;
    const slot = document.getElementById('slotMachine');
    slot.classList.add('spinning');

    document.getElementById('openBtn').disabled = true;
    document.getElementById('promoBtn').disabled = true;

    let count = 0;
    const interval = setInterval(() => {
      const fake = Math.floor(Math.random() * 20) + 1;
      document.getElementById('spinText').innerHTML = `
        <img src="https://i.postimg.cc/V6tZb84Y/optimize-fotor-bg-remover-20260905105812.png" alt="⭐" class="star-icon"> +${fake}
      `;
      document.getElementById('spinSub').textContent = '···';
      document.getElementById('spinRarity').textContent = '';
      count++;
      if (count > 12) {
        clearInterval(interval);
        slot.classList.remove('spinning');
        isSpinning = false;

        document.getElementById('spinText').innerHTML = '🎲 Демо';
        document.getElementById('spinSub').textContent = 'Ничего не выпало';
        document.getElementById('spinRarity').textContent = '';
        document.getElementById('spinRarity').className = 'spin-rarity';
        slot.style.borderColor = '#6a80b0';
        setTimeout(() => { slot.style.borderColor = 'rgba(60,140,255,0.04)'; }, 800);

        document.getElementById('openBtn').disabled = false;
        document.getElementById('promoBtn').disabled = false;
      }
    }, 70);
  }

  // ============================================================
  //  PROMO
  // ============================================================

  function activatePromo() {
    const code = document.getElementById('promoInput').value.trim().toUpperCase();
    if (!code) {
      document.getElementById('promoStatus').textContent = '❌ Введите промокод';
      document.getElementById('promoStatus').className = 'promo-status error';
      return;
    }

    if (state.usedPromoCodes.includes(code)) {
      document.getElementById('promoStatus').textContent = '❌ Этот промокод уже использован!';
      document.getElementById('promoStatus').className = 'promo-status error';
      return;
    }

    const validCodes = ['EASY2026', 'HORIZON777', 'VIPCASE', 'WELCOME'];
    if (!validCodes.includes(code)) {
      document.getElementById('promoStatus').textContent = '❌ Неверный промокод!';
      document.getElementById('promoStatus').className = 'promo-status error';
      return;
    }

    state.usedPromoCodes.push(code);
    currentPromoActivated = true;
    saveState();

    document.getElementById('promoStatus').textContent = '✅ Промокод активирован! Нажмите «Открыть»';
    document.getElementById('promoStatus').className = 'promo-status success';
    document.getElementById('openBtn').disabled = false;
    document.getElementById('promoInput').disabled = true;
    document.getElementById('promoBtn').disabled = true;
    setSlotResult('🎉', 'Промокод активирован!', '', '#5abf6a');
  }

  // ============================================================
  //  UI
  // ============================================================

  function updateUI() {
    document.getElementById('headerStars').textContent = Math.floor(state.balance);
    document.getElementById('balanceStars').textContent = Math.floor(state.balance);
    renderCases();
  }

  function renderCases() {
    const grid = document.getElementById('casesGrid');
    grid.innerHTML = '';
    CASES.forEach(c => {
      const card = document.createElement('div');
      card.className = 'case-card';

      card.innerHTML = `
        <span class="promo-badge">Промо</span>
        <img src="${c.icon}" alt="${c.name}" class="case-icon-img">
        <div class="case-name">${c.name}</div>
        <div class="case-price">
          <img src="https://i.postimg.cc/V6tZb84Y/optimize-fotor-bg-remover-20260905105812.png" alt="⭐" class="star-icon-sm"> ${c.price}
        </div>
      `;
      card.addEventListener('click', () => openCasePage(c.id));
      grid.appendChild(card);
    });
  }

  function openCasePage(caseId) {
    currentCase = CASES.find(c => c.id === caseId);
    if (!currentCase) return;

    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('casePage').classList.add('active');

    document.getElementById('casePageIcon').src = currentCase.icon;
    document.getElementById('casePageName').textContent = currentCase.name;

    // Запускаем Lottie в главном призе
    destroyLottie(lottiePrizeInstance);
    setTimeout(() => {
      lottiePrizeInstance = initLottie('mainPrizeLottie', true, true);
    }, 100);

    const promoArea = document.getElementById('promoArea');
    promoArea.style.display = 'flex';
    document.getElementById('promoInput').disabled = false;
    document.getElementById('promoInput').value = '';
    document.getElementById('promoBtn').disabled = false;
    document.getElementById('promoStatus').textContent = '';
    document.getElementById('promoStatus').className = 'promo-status';
    document.getElementById('openBtn').disabled = true;
    currentPromoActivated = false;

    // ===== ПРИЗЫ ИЗ JSON =====
    if (PRIZES.length > 0) {
      const mainPrize = PRIZES[0];
      document.getElementById('mainPrizeStarsRight').textContent = mainPrize.stars;

      const list = document.getElementById('prizesList');
      list.innerHTML = '';
      PRIZES.slice(1).forEach(p => {
        const row = document.createElement('div');
        row.className = 'prize-row';
        row.innerHTML = `
          <span class="p-name">🎁 ${p.name}</span>
          <span class="p-stars">
            <img src="https://i.postimg.cc/V6tZb84Y/optimize-fotor-bg-remover-20260905105812.png" alt="⭐" class="star-icon-sm"> ${p.stars}
          </span>
        `;
        list.appendChild(row);
      });
    }

    document.getElementById('spinText').innerHTML = `
      <img src="https://i.postimg.cc/V6tZb84Y/optimize-fotor-bg-remover-20260905105812.png" alt="⭐" class="star-icon"> +0
    `;
    document.getElementById('spinSub').textContent = 'Нажмите «Открыть»';
    document.getElementById('spinRarity').textContent = '';
    document.getElementById('spinRarity').className = 'spin-rarity';
    document.getElementById('slotMachine').style.borderColor = 'rgba(60,140,255,0.04)';

    document.querySelectorAll('#bottomNav button').forEach(b => b.classList.remove('active'));
  }

  function goToMain() {
    document.getElementById('casePage').classList.remove('active');
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-main').classList.add('active');
    document.querySelectorAll('#bottomNav button').forEach(b => b.classList.remove('active'));
    document.querySelector('#bottomNav button[data-tab="main"]').classList.add('active');
    updateUI();
  }

  // ============================================================
  //  EVENTS
  // ============================================================

  document.getElementById('backBtn').addEventListener('click', goToMain);
  document.getElementById('openBtn').addEventListener('click', () => startSpin(false));
  document.getElementById('demoBtn').addEventListener('click', () => startSpin(true));
  document.getElementById('promoBtn').addEventListener('click', activatePromo);
  document.getElementById('promoInput').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') activatePromo();
  });

  document.querySelectorAll('#bottomNav button').forEach(btn => {
    btn.addEventListener('click', function() {
      const tabId = this.dataset.tab;
      if (tabId === 'main') {
        goToMain();
        return;
      }
      document.getElementById('casePage').classList.remove('active');
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.getElementById('tab-' + tabId).classList.add('active');
      document.querySelectorAll('#bottomNav button').forEach(b => b.classList.remove('active'));
      this.classList.add('active');
    });
  });

  document.addEventListener('keydown', (e) => {
    if ((e.key === ' ' || e.key === 'Space') && document.getElementById('casePage').classList.contains('active')) {
      e.preventDefault();
      startSpin(false);
    }
  });

  // ============================================================
  //  START
  // ============================================================

  loadState();
  console.log('🌌 Horizon Case загружен');
  console.log('🔑 Промокоды: EASY2026, HORIZON777, VIPCASE, WELCOME');
  console.log('📦 Призы из JSON:', PRIZES);
  console.log('🎬 Анимация главного приза:', LOTTIE_URL);
</script>
</body>
</html>
